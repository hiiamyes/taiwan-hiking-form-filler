<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taiwan Hiking Form Filler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>登山申請自動填表</h1>
      <label for="route">路線</label>
      <select id="route" required>
        <option value="">請選擇路線</option>
      </select>
      <label for="team-name">隊伍名稱</label>
      <input id="team-name" type="text" required />
      <label for="start-date">入園日期</label>
      <input id="start-date" type="date" required />
      <label for="member-file">成員資料</label>
      <input id="member-file" type="file" accept=".json,application/json" required />
      <p id="member-status" class="field-status"></p>
      <button id="start" type="button" disabled>Start</button>
      <a class="application-link" href="https://hike.taiwan.gov.tw/apply_1.aspx" target="_blank">
        開啟登山申請頁面
      </a>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
